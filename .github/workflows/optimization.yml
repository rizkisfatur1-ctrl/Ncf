name: Performance - SIMD & Optimization

on:
  push:
    branches: [main]
    paths:
      - 'ncf-core/src/simd_kernels.rs'
      - 'ncf-core/src/cache.rs'
      - 'ncf-core/src/index_optimization.rs'
      - 'ncf-io/src/chunk_scheduler.rs'
      - 'ncf-convert/src/adaptive_compression.rs'
  pull_request:
    branches: [main]

jobs:
  simd_tests:
    name: SIMD & Optimization Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true

      - name: Enable SIMD features
        run: export RUSTFLAGS="-C target-feature=+avx2"

      - name: Test SIMD kernels
        run: |
          cargo test -p ncf-core simd_kernels --release --verbose
          
      - name: Test LRU cache
        run: |
          cargo test -p ncf-core cache --release --verbose
          
      - name: Test index optimization
        run: |
          cargo test -p ncf-core index_optimization --release --verbose
          
      - name: Test chunk scheduler
        run: |
          cargo test -p ncf-io chunk_scheduler --release --verbose
          
      - name: Test adaptive compression
        run: |
          cargo test -p ncf-convert adaptive_compression --release --verbose

  perf_comparison:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Run benchmarks
        run: |
          cargo bench --all --verbose 2>&1 | tee perf-results.txt
          
      - name: Parse benchmark results
        run: |
          echo "## Performance Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep -E "^\s+time:" perf-results.txt | head -10 >> $GITHUB_STEP_SUMMARY || true
          
      - name: Compare with baseline
        run: |
          # This would compare with previous run metrics
          # Placeholder for CI comparison logic
          echo "Performance comparison would run here"

  memory_audit:
    name: Memory Safety Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          components: miri

      - name: Run miri tests (memory safety)
        run: |
          cargo +nightly miri test -p ncf-core --lib 2>&1 || true

  security_audit:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run security audit
        uses: rustsec/audit-check-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
